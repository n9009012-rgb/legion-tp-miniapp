<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LEGION TP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--red:#ef1010;--red2:#ff3030;--dark:#15171b;--dark2:#22252b;--bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#7c828c;--line:#e7e8eb;--green:#1faa59}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:24px}.hero{margin:0 0 20px;padding:12px 14px 16px;background:linear-gradient(145deg,#e90000,#ff1919);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 14px 28px rgba(239,16,16,.18)}
.top{display:flex;align-items:flex-start;justify-content:space-between}.logo{width:190px;max-width:55vw;border-radius:12px;box-shadow:0 5px 16px rgba(0,0,0,.12)}.bell{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(255,255,255,.1);font-size:21px}
.greeting{margin-top:14px;font-size:27px;font-weight:850;line-height:1.05;letter-spacing:-.02em}.user{margin-top:5px;font-size:14px;opacity:.92}
.status{margin-top:18px;padding:13px 14px;border:1px solid rgba(255,255,255,.22);background:rgba(170,0,0,.28);border-radius:17px;display:flex;align-items:center;gap:10px}.dot{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.12);flex:none}.status b{display:block;font-size:15px}.status small{display:block;opacity:.8;margin-top:2px}
main{padding:0 14px}.section-title{margin:0 0 10px 3px;font-size:12px;letter-spacing:.08em;font-weight:800;color:#7b8088}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e5e7ea;background:#fff;border-radius:21px;min-height:128px;padding:16px 14px;box-shadow:0 8px 22px rgba(20,24,32,.07);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:transform .12s ease,box-shadow .12s ease}.card:active{transform:scale(.975);box-shadow:0 2px 10px rgba(20,24,32,.1)}.icon{width:44px;height:44px;border-radius:15px;background:#fff0f0;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px}.card strong{align-self:center;font-size:17px}.card small{align-self:center;color:var(--muted);font-size:12px}.wide{grid-column:1/-1;min-height:106px;flex-direction:row;align-items:center}.wide .copy{flex:1;text-align:right}.wide strong,.wide small{display:block}
.today{margin-top:12px;background:var(--dark);color:#fff;border-radius:22px;padding:16px}.today-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}.version{font-size:11px;color:#ff5555}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metric{background:#292d35;border-radius:15px;padding:14px}.metric b{display:block;font-size:24px}.metric span{font-size:11px;color:#b8bdc7}
.footer{text-align:center;color:#9aa0a9;font-size:10px;margin-top:18px;letter-spacing:.08em;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 18px 26px}.sheet h3{margin:0 0 10px}.sheet input{width:100%;font-size:28px;padding:13px;border:1px solid #ddd;border-radius:14px;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{border:0;border-radius:14px;padding:14px;font-weight:800}.primary{background:var(--red);color:#fff}.secondary{background:#eee}.toast{position:fixed;left:18px;right:18px;bottom:18px;background:#15171b;color:#fff;padding:13px 15px;border-radius:15px;display:none;z-index:20}
</style>
</head>
<body>
<header class="hero">
  <div class="top"><img class="logo" src="legion-logo.png" alt="LEGION"><button class="bell" onclick="notify()">🔔</button></div>
  <div class="greeting">Добрый день</div><div class="user" id="userName">Торговый представитель</div>
  <div class="status"><span class="dot"></span><div><b id="statusText">Проверяем статус…</b><small id="statusSub">Подключение к Legion</small></div><span style="margin-left:auto">•</span></div>
</header>
<main>
  <div class="section-title">РАБОТА</div>
  <div class="grid">
    <button class="card" onclick="work('start')"><span class="icon">▶</span><strong>Начать работу</strong><small>Фото и геолокация</small></button>
    <button class="card" onclick="work('end')"><span class="icon">■</span><strong>Завершить</strong><small>Фото и геолокация</small></button>
    <button class="card" onclick="scanQR()"><span class="icon">▦</span><strong>Сканер QR</strong><small>Открыть сканирование</small></button>
    <button class="card" onclick="send('report')"><span class="icon">▤</span><strong>Мой отчёт</strong><small>Результаты за день</small></button>
    <button class="card wide" onclick="openMetric()"><span class="icon">🍾</span><span class="copy"><strong>Продажи</strong><small>Заказы и количество бутылок</small></span></button>
  </div>
  <section class="today"><div class="today-head"><span>Сегодня</span><span class="version">LEGION TP 1.2</span></div><div class="metrics"><div class="metric"><b id="orders">0</b><span>заказов</span></div><div class="metric"><b id="bottles">0</b><span>бутылок</span></div></div></section>
  <div class="footer">LEGION ASIA DISTRIBUTION</div>
</main>

<div class="modal" id="metricModal"><div class="sheet"><h3 id="metricTitle">Продажи</h3><input id="metricValue" type="number" min="0" max="100000" inputmode="numeric" placeholder="0"><div class="actions"><button class="secondary" onclick="closeMetric()">Отмена</button><button class="primary" onclick="saveMetric()">Сохранить</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();tg.setHeaderColor('#ef1010');tg.setBackgroundColor('#f4f5f7');}
const $=id=>document.getElementById(id);
let metricType=null;

function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function send(action,extra={}){if(!tg){toast('Откройте приложение внутри Telegram');return}tg.sendData(JSON.stringify({action,...extra,ts:Date.now()}));toast('Команда отправлена в Legion');}
function work(type){
  if(!navigator.geolocation){send(type);return}
  navigator.geolocation.getCurrentPosition(pos=>{
    send(type,{latitude:pos.coords.latitude,longitude:pos.coords.longitude});
  },()=>{toast('Геолокация не разрешена');send(type,{location_denied:true})},{enableHighAccuracy:true,timeout:10000});
}
function openMetric(){metricType='orders';$('metricTitle').textContent='Количество заказов';$('metricValue').value='';$('metricModal').style.display='flex'}
function closeMetric(){$('metricModal').style.display='none'}
function saveMetric(){const v=Number($('metricValue').value);if(!Number.isInteger(v)||v<0||v>100000){toast('Введите целое число от 0 до 100000');return}
  // Orders first; a second tap on the sales card switches to bottles.
  if(metricType==='orders'){send('orders',{value:v});$('orders').textContent=v;metricType='bottles';$('metricTitle').textContent='Количество бутылок';$('metricValue').value='';}
  else {send('bottles',{value:v});$('bottles').textContent=v;closeMetric();}
}
function scanQR(){send('qr')}
function notify(){send('notifications')}
</script>
</body>
</html>
